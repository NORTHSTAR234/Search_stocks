name: Refresh non-US market prices (private owner cache)

on:
  # A new stock report gets a ONE-TIME last-observed quote immediately,
  # even if the exchange is closed. Only exchange-suffixed non-US report folders
  # trigger initial quotes; unsuffixed US report pushes leave Alpaca untouched.
  # Normal recurring quotes stay session-only.
  push:
    branches: [main]
    paths:
      - 'halal/*.*/*.html'
      - 'nonhalal/*.*/*.html'
      - 'Website/market-exchanges.json'
      - 'Website/scripts/collect-international-quotes.py'
      - 'Website/scripts/collect-international-history.py'
      - '.github/workflows/refresh-international-prices.yml'
  # UTC covered by the currently tracked ASX/TWSE/MYX/XAMS/XPAR/SIX
  # regular sessions across Sydney and European daylight-saving changes.
  # The collector still checks exact exchange-local weekdays and hours.
  # If an exchange outside this coverage is later added, review this window.
  # 23:00 UTC Sun-Thu covers 10:00 AEDT Mon-Fri ASX opening.
  # 00:00-16:59 UTC Mon-Fri covers Asian through European closes.
  schedule:
    - cron: '*/20 23 * * 0-4'
    - cron: '*/20 0-16 * * 1-5'
    # EOD daily indicator history after Asia/Europe sessions, before US daily report
    - cron: '40 21 * * 1-5'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'One-time manual initialization of last available non-US quotes (no trading-hours changes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: international-price-cache
  cancel-in-progress: true

jobs:
  update-international-quotes:
    if: github.repository == 'NORTHSTAR234/Search_stocks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read tracked stock report folders
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check market weekdays and regular sessions
        id: market
        env:
          BOOTSTRAP_MARKETS: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap == true)) }}
        run: |
          if [ "$BOOTSTRAP_MARKETS" = "true" ]; then
            python Website/scripts/collect-international-quotes.py --bootstrap --check-open
          else
            python Website/scripts/collect-international-quotes.py --check-open
          fi
      - name: Install yfinance only while a relevant exchange is trading
        if: steps.market.outputs.open == 'true'
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.65,<1'
      - name: Collect delayed Yahoo observations and publish privately using GitHub OIDC
        if: steps.market.outputs.open == 'true'
        env:
          BOOTSTRAP_MARKETS: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap == true)) }}
        run: |
          if [ "$BOOTSTRAP_MARKETS" = "true" ]; then
            python Website/scripts/collect-international-quotes.py --bootstrap
          else
            python Website/scripts/collect-international-quotes.py
          fi

  collect-daily-technical-history:
    # One daily run, plus an initial one-time rollout. No 20-min repeat history queries.
    if: >-
      github.repository == 'NORTHSTAR234/Search_stocks' &&
      github.ref == 'refs/heads/main' &&
      (github.event.schedule == '40 21 * * 1-5' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, 'Deploy daily signals')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yfinance (one daily collection only)
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.65,<1'
      - name: Send private owner-only daily history by signed GitHub OIDC
        run: python Website/scripts/collect-international-history.py
