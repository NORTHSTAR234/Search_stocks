name: Daily signals final acceptance
on:
  pull_request:
    paths:
      - 'Website/**'
      - '.github/workflows/daily-signals-ci.yml'
      - '.github/workflows/refresh-international-prices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website build/test dependencies
        working-directory: Website
        run: npm install --no-audit --no-fund
      - name: Run complete website regression suite including daily signals
        working-directory: Website
        run: npm test
      - name: Build production HTML without publishing private access data
        working-directory: Website
        env:
          PUBLISH_REPORTS: 'yes'
        run: |
          npm run build
          test -f dist/daily-signals/index.html
          test -f dist/assets/daily-signals.js
          grep -q 'Daily Stock Signals' dist/daily-signals/index.html
      - name: Compile OIDC collector and block brokerage order implementation
        run: |
          python -m py_compile Website/scripts/collect-international-history.py
          python -m py_compile Website/scripts/collect-international-quotes.py
          if grep -R -n -E 'submitOrder|createOrder|placeOrder|/v2/orders' Website/lib/daily-signals.mjs Website/worker/daily-*.mjs Website/functions/api/daily-signals.js; then
            echo 'Unexpected brokerage execution in daily research'
            exit 1
          fi
