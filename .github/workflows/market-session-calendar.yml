name: Build international market session calendar (Sydney time)
on:
  schedule:
    - cron: '17 0,12 * * *'
  push:
    branches: [main]
    paths:
      - 'Website/market-exchanges.json'
      - 'Website/scripts/build-market-sessions.py'
      - '.github/workflows/market-session-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: exchange-session-calendar-main
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'NORTHSTAR234/Search_stocks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned calendar library
        run: python -m pip install --disable-pip-version-check exchange_calendars==4.13.1
      - name: Generate sessions including holidays, half-days and Sydney time
        run: python Website/scripts/build-market-sessions.py
      - name: Commit changed calendar only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Website/market-sessions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified international trading sessions [skip ci]'
          git push origin HEAD:main
