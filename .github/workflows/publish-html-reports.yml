name: Publish HTML stock-report index

on:
  push:
    branches: [main]
    paths:
      - 'halal/**/*.html'
      - 'nonhalal/**/*.html'
      - 'Website/scripts/build-live-reports.mjs'
      - 'Website/lib/report-archive.mjs'
      - 'Website/tests/snapshot-contract.test.mjs'
      - 'Website/market-exchanges.json'
      - 'Website/scripts/collect-international-quotes.py'
      - 'Website/scripts/tests/**'
      - 'Website/assets/app.js'
      - 'Website/functions/api/international-prices.js'
      - 'Website/tests/ui.test.mjs'
      - 'Website/tests/build.test.mjs'
      - 'Website/build.mjs'
      - 'Website/tests/prices.test.mjs'
      - '.github/workflows/publish-html-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: html-report-manifest-main
  cancel-in-progress: false

jobs:
  update-index:
    if: github.repository == 'NORTHSTAR234/Search_stocks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest archive
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard test dependencies
        run: npm --prefix Website install --no-audit --no-fund
      - name: Verify new and legacy dashboard regressions
        run: node --test Website/tests/*.test.mjs
      - name: Verify international price collector syntax and exchange session configuration
        run: |
          python3 -m py_compile Website/scripts/collect-international-quotes.py
          python3 -m unittest discover -s Website/scripts/tests -p 'test_*.py' -v
          python3 Website/scripts/collect-international-quotes.py --check-open
      - name: Rebuild read-only HTML archive index
        run: node Website/scripts/build-live-reports.mjs
      - name: Commit index only if reports changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Website/live-reports.json
          if git diff --cached --quiet; then
            echo "No HTML report index changes."
            exit 0
          fi
          git commit -m "Update HTML stock-report index [skip ci]"
          git push origin HEAD:main
