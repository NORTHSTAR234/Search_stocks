name: Publish HTML stock-report index

on:
  push:
    branches: [main]
    paths:
      - 'halal/**/*.html'
      - 'nonhalal/**/*.html'
      - 'Website/scripts/build-live-reports.mjs'
      - 'Website/scripts/reconcile-owner-screening-reviews.mjs'
      - 'Website/data/shariah-user-reviews.json'
      - 'Website/tests/shariah-user-reviews.test.mjs'
      - 'Website/lib/ethical-policy.mjs'
      - 'Website/lib/ethical-dataset.mjs'
      - 'Website/lib/investigate-dataset.mjs'
      - 'Website/data/rizqinvests-ethical-bds-2026-11.json'
      - 'Website/data/investigate-ethical-concerns-2025-07.json'
      - 'Website/assets/ethical-db.js'
      - 'Website/assets/investigate-db.js'
      - 'Website/ethical-database/index.html'
      - 'Website/tests/ethical-policy.test.mjs'
      - 'Website/tests/ethical-dataset.test.mjs'
      - 'Website/tests/investigate-dataset.test.mjs'
      - 'Website/lib/report-archive.mjs'
      - 'Website/lib/stock-profile.mjs'
      - 'Website/assets/style.css'
      - 'Website/tests/stock-profile.test.mjs'
      - 'Website/tests/snapshot-contract.test.mjs'
      - 'Website/market-exchanges.json'
      - 'Website/scripts/collect-international-quotes.py'
      - 'Website/scripts/tests/**'
      - 'Website/assets/app.js'
      - 'Website/functions/api/international-prices.js'
      - 'Website/tests/ui.test.mjs'
      - 'Website/tests/build.test.mjs'
      - 'Website/build.mjs'
      - 'Website/tests/prices.test.mjs'
      - 'Website/tests/github-sync.test.mjs'
      - 'Website/lib/github-archive.mjs'
      - 'Website/functions/api/github-reports.js'
      - 'Website/functions/view-report.js'
      - '.github/workflows/publish-html-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: html-report-manifest-main
  cancel-in-progress: false

jobs:
  update-index:
    if: github.repository == 'NORTHSTAR234/Search_stocks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest archive
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard test dependencies
        run: npm --prefix Website install --no-audit --no-fund
      - name: Reconcile any owner-flagged stocks into nonhalal folder
        run: node Website/scripts/reconcile-owner-screening-reviews.mjs
      - name: Verify new and legacy dashboard regressions
        run: node --test Website/tests/*.test.mjs
      - name: Verify international price collector syntax and exchange session configuration
        run: |
          python3 -m py_compile Website/scripts/collect-international-quotes.py
          python3 -m unittest discover -s Website/scripts/tests -p 'test_*.py' -v
          python3 Website/scripts/collect-international-quotes.py --check-open
      # New reports are often committed seconds apart. A checkout becomes stale
      # before the index push; rebuild from the latest origin/main and retry
      # rejected non-fast-forward pushes instead of mailing the owner failures.
      - name: Publish current HTML archive index with conflict-safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 12); do
            echo "Index publication attempt ${attempt}/12: fetch latest main."
            git fetch --no-tags origin main
            # This is an ephemeral CI checkout; never force-push or delete reports.
            git reset --hard origin/main
            # Create new administrative copies of owner-designated halal-folder stocks.
            # Never delete old reports or weaken full-research depth tests.
            node Website/scripts/reconcile-owner-screening-reviews.mjs
            # Revalidate the latest report set, including any reports pushed
            # while this workflow was running. Do not relax the quality gate.
            node --test Website/tests/*.test.mjs
            node Website/scripts/build-live-reports.mjs
            git add Website/live-reports.json nonhalal/
            if git diff --cached --quiet; then
              echo "Index is current; no commit needed."
              exit 0
            fi
            git commit -m "Update HTML stock-report index [skip ci]"
            if git push origin HEAD:main; then
              echo "Index safely published from latest main."
              exit 0
            fi
            echo "::warning::A newer stock report landed during the index push; retrying against fresh main."
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish index after 12 race-safe attempts."
          exit 1
